<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Download - Jogo "Pai contra Mãe"</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
    <style>
        * { box-sizing: border-box; margin:0; padding:0; }
        body {
            background-image: url('fundo cidade noite.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center center;
            font-family: 'Press Start 2P', cursive;
            color: #FFF;
            padding: 50px;
            image-rendering: pixelated;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { 
            width:100%; 
            max-width:1400px; 
            margin:0 auto; 
            position:relative; 
        }

        .pixel-border {
            position: relative;
            border: 4px solid #FFFFFF;
            box-shadow: 0 0 0 4px #000000;
            background: rgba(0, 100, 0, 0.8);
        }

        header {
            display:flex; 
            justify-content:space-between; 
            align-items:center;
            padding:20px 30px; 
            background:#004d00; 
            margin-bottom:25px;
        }
        header h1 {
            font-size: 1.8em; 
            text-shadow: 3px 3px 0 #000;
            letter-spacing: 1px;
            color: #fff;
            white-space: nowrap;
        }
        nav ul { 
            list-style:none; 
            display:flex; 
            gap:25px; 
            flex-wrap: wrap;
        }
        nav a { 
            color:#FFF; 
            text-decoration:none; 
            font-size:0.95em; 
            padding:10px 12px; 
            text-shadow:1px 1px 0 #000; 
            position: relative;
            transition: all 0.2s;
        }
        nav a:hover, nav a.active { 
            color:#FFFF00; 
            transform:translateY(-2px); 
        }
        nav a:after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #FFFF00;
            transition: width 0.3s;
        }
        nav a:hover:after, nav a.active:after { 
            width: 100%; 
        }

        .content-box { 
            width:100%; 
            padding:35px; 
            margin-bottom:30px; 
            position:relative; 
        }
        .content-box h2 { 
            text-align:center; 
            font-size:1.8em; 
            text-shadow:3px 3px 0 #000; 
            padding-bottom:20px; 
            margin-bottom:30px; 
            border-bottom:4px solid #FFF; 
            color:#FFFF00; 
        }

        .distro-list {
            display: flex;
            flex-direction: column;
            gap: 25px; 
            margin-bottom: 15px;
        }

        .download-item {
            display:flex; 
            flex-direction:column; 
            padding:25px; 
            margin-bottom:0;
            background: rgba(0,77,0,0.7); 
            border:4px solid #FFF;
            gap:15px; 
            width:100%;
            transition: transform 0.3s;
        }
        .download-item:hover {
            transform: scale(1.02);
            background: rgba(0, 100, 0, 0.8);
        }
        .download-header { 
            display:flex; 
            justify-content:space-between; 
            align-items:center; 
            margin-bottom:10px; 
            gap:15px; 
            flex-wrap:wrap;
        }
        .download-header h3 { 
            font-size:1.2em; 
            text-shadow:2px 2px 0 #000; 
            margin:0; 
            color: #FFFF00;
        }

        .download-version { 
            background:#8B0000; 
            padding:8px 15px; 
            font-size:0.9em; 
            display:inline-block; 
            border: 2px solid #000;
        }

        .download-info {
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap:15px; 
            margin-bottom:10px; 
            font-size:0.95em;
            line-height: 1.7; 
        }

        .info-item { 
            word-break: break-word; 
            white-space: normal; 
            color: #fff; 
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .info-item strong { 
            color:#FFFF00; 
            display:block; 
            margin-bottom:8px; 
            font-size: 1.05em;
        }

        .download-buttons { 
            display:flex; 
            gap:15px; 
            flex-wrap:wrap; 
            margin-top:15px; 
        }
        .download-button {
            display:inline-block; 
            padding:12px 20px; 
            background:#8B0000; 
            color:#FFF; 
            text-decoration:none;
            border:4px solid; 
            border-color:#fff #000 #000 #fff; 
            font-family:'Press Start 2P', cursive; 
            font-size:0.9em; 
            cursor:pointer; 
            text-shadow:1px 1px 0 #000;
            transition: all 0.2s;
        }
        .download-button:hover { 
            background:#A52A2A; 
            transform:translateY(-3px); 
            color: #FFFF00;
        }

        .small-note { 
            font-size:0.85em; 
            color:#ddd; 
            margin-top:15px; 
            line-height:1.7; 
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-left: 3px solid #FFFF00;
        }

        .requirements { 
            padding:25px; 
            background:rgba(0,77,0,0.7); 
            border:4px solid #FFF; 
            margin-top:25px; 
            line-height:1.7; 
        }
        .requirements h3 { 
            margin-bottom:20px; 
            color:#FFFF00; 
            text-shadow:2px 2px 0 #000; 
            font-size: 1.2em;
        }
        .requirements ul { 
            list-style:none; 
            font-size:0.95em; 
            line-height:1.8; 
        }
        .requirements li { 
            margin-bottom:12px; 
            position:relative; 
            padding-left:25px; 
        }
        .requirements li:before { 
            content: ">"; 
            position:absolute; 
            left:0; 
            color:#FFFF00; 
            font-weight: bold;
        }

        .support-contact { 
            word-break: break-word; 
            white-space: normal; 
            line-height:1.7; 
            color:#fff; 
        }

        footer { 
            text-align:center; 
            padding:25px; 
            font-size:0.85em; 
            color:#AAA; 
            text-shadow:1px 1px 0 #000; 
            margin-top:25px; 
            line-height: 1.6;
        }
